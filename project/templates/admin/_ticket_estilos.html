<!-- Estilos compartidos por los tickets imprimibles (WeasyPrint): venta/ticket_venta.html y
     caja/ticket_cierre_caja.html. Todo en negro a propósito: se imprimen en ticketeras térmicas
     (sin color). Mismo lenguaje visual que el modal "Resumen de cierre" de CajaPage.tsx —
     divisores con etiqueta centrada, filas atenuadas, total grande al pie. Cambiar acá impacta a
     ambos tickets. -->
<style>
  @page {
    /* Sin `size`, WeasyPrint arma la página en A4 (210mm) y la impresora térmica la achica
       para entrar en el rollo -> el ticket sale minúsculo. Poné acá el ancho real del rollo
       (58mm o 80mm son los anchos estándar de ticketeras térmicas). El alto no puede ser
       "auto" (WeasyPrint no lo soporta y lo ignora en silencio, volviendo a A4) — se pone uno
       bien grande de sobra, así nunca corta el contenido a una segunda página; el driver de
       la impresora térmica corta el rollo donde termina el contenido real. `.ticket` ocupa el
       100% del ancho de página, así no hay que tocar nada más al cambiar el ancho acá. */
    size: 58mm 1000mm;
    margin: 2mm 0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "DejaVu Sans", Arial, sans-serif;
    font-size: 12px;
    color: #212529;
  }
  .ticket {
    width: 100%;
    padding: 0 3mm;
  }
  .titulo {
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 2px;
  }
  .subtitulo {
    text-align: center;
    color: #868e96;
    font-size: 11px;
    margin: 0 0 14px;
  }
  .fila {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    margin: 3px 0;
  }
  .fila .etiqueta { color: #868e96; }
  .fila.destacada {
    font-weight: 700;
    margin-top: 6px;
  }
  .divisor {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 8px;
    color: #868e96;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .divisor::before, .divisor::after {
    content: "";
    flex: 1;
    border-top: 1px solid #dee2e6;
  }
  /* Un renglón por artículo, en dos líneas (nombre + importe arriba, cantidad x precio unitario
     abajo) en vez de una tabla de 4 columnas — a 58mm de ancho no entran Producto/Cant./P.
     Unit./Importe uno al lado del otro sin cortarse. */
  .articulo { margin: 7px 0; }
  .articulo-fila {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
  }
  .nombre-articulo { font-weight: 600; }
  .articulo-importe { font-weight: 600; white-space: nowrap; }
  .articulo-detalle {
    color: #868e96;
    font-size: 10.5px;
    margin-top: 1px;
  }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
  }
  .total .etiqueta { font-size: 12px; color: #495057; font-weight: 700; letter-spacing: .03em; }
  .total .importe { font-size: 22px; font-weight: 800; }
  .pie {
    text-align: center;
    color: #adb5bd;
    font-size: 10px;
    margin: 18px 0 0;
  }
</style>
